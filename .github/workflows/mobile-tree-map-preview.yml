name: Mobile tree hosted map check
on:
  pull_request:
    paths:
      - 'app/api/mobile-tree-gis/**'
      - 'public/testing/mobile-tree-address-map.mjs'
      - 'public/testing/mobile-tree-map-data.mjs'
      - 'public/testing/mobile-tree-map-facts.mjs'
      - 'public/testing/mobile-tree-worker-qualifications.mjs'
      - 'public/testing/mobile-tree-resident-workflow.mjs'
      - 'public/testing/mobile-tree-property-policy.mjs'
      - '.github/workflows/mobile-tree-map-preview.yml'
permissions:
  contents: read
jobs:
  hosted-map:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Install an isolated browser-test dependency
        run: npm install --prefix "$RUNNER_TEMP/tree-map-check" --no-audit --no-fund playwright
      - name: Validate the existing hosted preview, without submitting anything
        shell: bash
        env:
          PREVIEW_ORIGIN: https://deploy-preview-9--tree251.netlify.app
        run: |
          cat > "$RUNNER_TEMP/tree-map-check/check.mjs" <<'NODE'
          import assert from 'node:assert/strict';
          import {execSync} from 'node:child_process';
          import {chromium} from 'playwright';
          const origin=process.env.PREVIEW_ORIGIN;
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          let ready=false;
          for(let i=0;i<45;i++){
            try {const s=await (await fetch(origin+'/testing/mobile-tree-resident-workflow.mjs',{cache:'no-store',signal:AbortSignal.timeout(10000)})).text();if(s.includes('form.dataset.propertyRecords=loading')){ready=true;break;}}catch{}
            await sleep(4000);
          }
          assert.ok(ready,'Property-aware build has not reached the preview.');
          const addr=await (await fetch(origin+'/api/mobile-tree-gis?mode=address&q=6%20Maury%20Drive')).json();
          assert.equal(addr.status,'ok');assert.equal(addr.features.length,1);
          const p=addr.features[0].geometry;
          console.log('HOSTED_ADDRESS',JSON.stringify({address:addr.features[0].attributes.address,point:p,source:addr.source,fetchedAt:addr.fetchedAt}));
          const data=await (await fetch(origin+'/api/mobile-tree-gis?mode=context&lon='+p.x+'&lat='+p.y)).json();
          for(const k of ['city','historic','zoning','parcel'])assert.equal(data.layers[k].status,'ok',k+' must be readable');
          for(const query of ['mode=context&lon=abc&lat=30.6','mode=context&lon=-88.1&lat=30.6&layer=bad','mode=address&q=6%20Maury&url=https://example.com']){
            const r=await fetch(origin+'/api/mobile-tree-gis?'+query);assert.equal(r.status,400);
          }
          const executablePath=execSync('command -v google-chrome || command -v chromium || command -v chromium-browser',{encoding:'utf8'}).trim();
          const browser=await chromium.launch({executablePath,headless:true,args:['--no-sandbox']});
          try {
            const page=await browser.newPage({viewport:{width:390,height:844},deviceScaleFactor:1});
            const errors=[];page.on('pageerror',e=>errors.push(e.message));
            await page.goto(origin+'/testing/mobile-tree-checker.html',{waitUntil:'domcontentloaded'});
            await page.waitForSelector('#propertyMapAddress');
            await page.fill('#propertyMapAddress','6 Maury Drive');await page.check('#propertyMapConsent');await page.click('#findPropertyMap');
            await page.locator('#propertyMapCandidates button').first().click({timeout:40000});
            await page.waitForSelector('#applyMapAnswers:not([disabled])',{timeout:45000});
            await page.waitForSelector('#permitForm[data-property-records="ready"]',{timeout:45000});
            assert.equal(await page.inputValue('#scCity'),'unknown','Tree confirmation still needed for jurisdiction');
            await page.waitForSelector('.leaflet-tile-loaded',{timeout:30000});
            assert.equal(await page.locator('#propertyMapFacts .map-answer').count(),8);
            assert.match(await page.textContent('[data-layer="zoning"] .map-answer'),/R-1.*Single-Family Residential/);
            assert.match(await page.textContent('[data-layer="historic"] .map-answer'),/Not in a locally designated/);
            assert.match(await page.textContent('[data-layer="planning"]'),/plan: still unknown/);
            assert.equal(await page.locator('#propertyMapFacts details[open]').count(),0);
            await page.click('#applyMapAnswers');
            await page.waitForFunction(()=>document.getElementById('udcZoning').value==='r1r2');
            const filled={city:await page.inputValue('#scCity'),historic:await page.inputValue('#scHistoric'),zoning:await page.inputValue('#udcZoning'),overlay:await page.inputValue('#udcOverlay'),location:await page.inputValue('#scLocation'),plan:await page.inputValue('#udcPlan')};
            console.log('HOSTED_AUTOFILL',JSON.stringify(filled));
            assert.equal(filled.city,'inside');assert.equal(filled.historic,'no');assert.equal(filled.zoning,'r1r2');assert.equal(filled.location,'unknown');assert.equal(filled.plan,'unknown');
            await page.selectOption('#scLocation','row');await page.selectOption('#scWork','pruning');await page.selectOption('#scSpecies','liveoak');await page.fill('#scLimb','7');
            await page.click('#screenNow');await page.waitForSelector('#permitOutput:not(.hidden)');assert.match(await page.textContent('#permitOutcome'),/Commission/);
            await page.waitForSelector('#workerQualifications:not(.hidden)');assert.match(await page.textContent('#workerQualifications'),/ISA Certified Arborist/);
            await page.click('#reviewForestryEmail');await page.waitForSelector('#draftArea:not(.hidden)');
            const body=await page.inputValue('#emailBody');assert.match(body,/6 MAURY DR/);assert.match(body,/Map source:/);assert.match(body,/ISA Certified Arborist/);assert.match(body,/Zoning: R-1/);
            console.log('LIVE_INLINE_ANSWERS_PASS',JSON.stringify({zoningVisible:true,eightMapAnswers:true,optionalSourceLinks:true,propertyLookupCompleted:true,emailIncludesActualValues:true}));
            // Synthetic boundary covers BOTH the address reference and the tree point.
            // Clear prior property lookup, rather than incorrectly testing cached actual-property zoning against a tree-only fixture.
            const box=(x0,y0,x1,y1)=>({rings:[[[x0,y0],[x1,y0],[x1,y1],[x0,y1],[x0,y0]]]});
            const boundary=structuredClone(data);
            boundary.layers.zoning={...data.layers.zoning,status:'ok',spatialReference:{wkid:4326},features:[
              {attributes:{objectid:900001,district_code:'R-1',district_name:'Single-Family Residential',sub_district_code:'Suburban',sub_district_name:'Suburban',overlay:'N/A'},geometry:box(p.x-.002,p.y-.002,p.x+.00005,p.y+.002)},
              {attributes:{objectid:900002,district_code:'B-2',district_name:'Neighborhood Business',overlay:'N/A'},geometry:box(p.x+.00005,p.y-.002,p.x+.002,p.y+.002)}
            ]};
            const fixture=async route=>{
              const u=new URL(route.request().url());
              if(u.searchParams.get('mode')==='context')return route.fulfill({status:200,contentType:'application/json',body:JSON.stringify(boundary)});
              return route.continue();
            };
            await page.route('**/api/mobile-tree-gis?*',fixture);
            await page.fill('#propertyMapAddress','6 Maury DR');
            await page.click('#findPropertyMap');await page.locator('#propertyMapCandidates button').first().click({timeout:40000});
            await page.waitForSelector('#applyMapAnswers:not([disabled])',{timeout:45000});
            await page.waitForSelector('#permitForm[data-property-records="ready"]',{timeout:45000});
            const zoning=page.locator('[data-layer="zoning"]');
            assert.match(await zoning.locator('.map-answer').textContent(),/R-1.*Single-Family Residential/);
            assert.match(await zoning.locator('.map-caution').textContent(),/Near a mapped boundary/);
            assert.match(await zoning.textContent(),/Nearby only.*B-2/);
            await page.click('#applyMapAnswers');
            assert.equal(await page.inputValue('#udcZoning'),'unknown','A genuinely uncertain property zone must not be auto-confirmed');
            assert.match(await page.textContent('#udcZoningRecord'),/staff must resolve/);
            for(const width of [390,820,1200]){
              await page.setViewportSize({width,height:844});
              assert.ok(await page.evaluate(()=>document.body.scrollWidth<=innerWidth+2),'No horizontal overflow at '+width);
            }
            console.log('CONTROLLED_BOUNDARY_UI_PASS',JSON.stringify({fixtureNotActualProperty:true,containingZoningShown:true,nearbyZoneSeparated:true,propertyBoundaryUnknown:true,notAskedToGuess:true}));
            await page.unroute('**/api/mobile-tree-gis?*',fixture);
            await page.fill('#propertyMapAddress','205 Government Street');assert.equal(await page.inputValue('#scCity'),'unknown');assert.equal(await page.locator('#permitOutput').isVisible(),false);assert.equal(await page.locator('#draftArea').isVisible(),false);
            await page.route('**/api/mobile-tree-gis?*',route=>route.fulfill({status:502,contentType:'application/json',body:JSON.stringify({status:'unavailable',error:'Controlled test: City service unavailable.'})}));
            await page.click('#findPropertyMap');await page.waitForFunction(()=>document.getElementById('propertyMapStatus').textContent.includes('Controlled test'));assert.equal(await page.inputValue('#scCity'),'unknown');
            assert.deepEqual(errors,[]);
            console.log('HOSTED_BROWSER_PASS',JSON.stringify({checkedAt:new Date().toISOString(),browser:'Chrome, not physical iPhone',realAddressAndLayers:true,realImageryLoaded:true,inlineAnswers:true,controlledBoundaryRegression:true,permitResult:true,workerQualifications:true,emailContainsMapValues:true,changedAddressInvalidates:true,controlledOutageStaysUnknown:true,pageErrors:errors}));
          } finally {await browser.close();}
          NODE
          node "$RUNNER_TEMP/tree-map-check/check.mjs"
