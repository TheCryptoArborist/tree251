name: Mobile tree hosted map check
on:
  pull_request:
    paths:
      - 'app/api/mobile-tree-gis/**'
      - 'public/testing/mobile-tree-address-map.mjs'
      - 'public/testing/mobile-tree-map-data.mjs'
      - 'public/testing/mobile-tree-worker-qualifications.mjs'
      - '.github/workflows/mobile-tree-map-preview.yml'
permissions:
  contents: read
jobs:
  hosted-map:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Install an isolated browser-test dependency
        run: npm install --prefix "$RUNNER_TEMP/tree-map-check" --no-audit --no-fund playwright
      - name: Validate the existing hosted preview, without submitting anything
        shell: bash
        env:
          PREVIEW_ORIGIN: https://deploy-preview-9--tree251.netlify.app
        run: |
          cat > "$RUNNER_TEMP/tree-map-check/check.mjs" <<'NODE'
          import assert from 'node:assert/strict';
          import {execSync} from 'node:child_process';
          import {chromium} from 'playwright';
          const origin=process.env.PREVIEW_ORIGIN;
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          let ready=false;
          for(let i=0;i<35;i++){
            try {const s=await (await fetch(origin+'/testing/mobile-tree-address-map.mjs',{cache:'no-store',signal:AbortSignal.timeout(10000)})).text();if(s.includes('#mapProvenance{overflow-wrap:anywhere')){ready=true;break;}}catch{}
            await sleep(4000);
          }
          assert.ok(ready,'Current map layout has not reached the existing preview.');
          const addr=await (await fetch(origin+'/api/mobile-tree-gis?mode=address&q=6%20Maury%20Drive')).json();
          assert.equal(addr.status,'ok');assert.equal(addr.features.length,1);
          const p=addr.features[0].geometry;
          console.log('HOSTED_ADDRESS',JSON.stringify({address:addr.features[0].attributes.address,point:p,source:addr.source,fetchedAt:addr.fetchedAt}));
          const data=await (await fetch(origin+'/api/mobile-tree-gis?mode=context&lon='+p.x+'&lat='+p.y)).json();
          console.log('HOSTED_LAYERS',JSON.stringify(Object.fromEntries(Object.entries(data.layers).map(([k,v])=>[k,{status:v.status,count:v.features.length,source:v.source}]))));
          for(const k of ['city','historic','zoning','parcel'])assert.equal(data.layers[k].status,'ok',k+' must be readable');
          for(const query of ['mode=context&lon=abc&lat=30.6','mode=context&lon=-88.1&lat=30.6&layer=bad','mode=address&q=6%20Maury&url=https://example.com']){
            const r=await fetch(origin+'/api/mobile-tree-gis?'+query);assert.equal(r.status,400);
          }
          const executablePath=execSync('command -v google-chrome || command -v chromium || command -v chromium-browser',{encoding:'utf8'}).trim();
          const browser=await chromium.launch({executablePath,headless:true,args:['--no-sandbox']});
          try {
            const page=await browser.newPage({viewport:{width:390,height:844},deviceScaleFactor:1});
            const errors=[];page.on('pageerror',e=>errors.push(e.message));
            await page.goto(origin+'/testing/mobile-tree-checker.html',{waitUntil:'domcontentloaded'});
            await page.waitForSelector('#propertyMapAddress');
            await page.fill('#propertyMapAddress','6 Maury Drive');await page.check('#propertyMapConsent');await page.click('#findPropertyMap');
            await page.locator('#propertyMapCandidates button').first().click({timeout:40000});
            await page.waitForSelector('#applyMapAnswers:not([disabled])',{timeout:45000});
            assert.equal(await page.inputValue('#scCity'),'unknown','Address point alone must not populate jurisdiction');
            await page.waitForSelector('.leaflet-tile-loaded',{timeout:30000});await page.click('#applyMapAnswers');
            const filled={city:await page.inputValue('#scCity'),historic:await page.inputValue('#scHistoric'),zoning:await page.inputValue('#udcZoning'),overlay:await page.inputValue('#udcOverlay'),location:await page.inputValue('#scLocation'),plan:await page.inputValue('#udcPlan')};
            console.log('HOSTED_AUTOFILL',JSON.stringify(filled));
            assert.equal(filled.city,'inside');assert.equal(filled.historic,'no');assert.equal(filled.zoning,'r1r2');assert.equal(filled.location,'unknown');assert.equal(filled.plan,'unknown');
            await page.selectOption('#scLocation','row');await page.selectOption('#scWork','pruning');await page.selectOption('#scSpecies','liveoak');await page.fill('#scLimb','7');
            await page.click('#screenNow');await page.waitForSelector('#permitOutput:not(.hidden)');assert.match(await page.textContent('#permitOutcome'),/Commission/);
            await page.waitForSelector('#workerQualifications:not(.hidden)');assert.match(await page.textContent('#workerQualifications'),/ISA Certified Arborist/);
            await page.click('#reviewForestryEmail');await page.waitForSelector('#draftArea:not(.hidden)');
            const body=await page.inputValue('#emailBody');assert.match(body,/6 MAURY DR/);assert.match(body,/Map source:/);assert.match(body,/ISA Certified Arborist/);
            const layout=await page.evaluate(()=>({width:innerWidth,scroll:document.body.scrollWidth,wide:[...document.querySelectorAll('body *')].filter(e=>{const r=e.getBoundingClientRect();return r.width>0&&(r.right>innerWidth+2||r.left<-2)&&getComputedStyle(e).position!=='absolute';}).slice(0,12).map(e=>({id:e.id,tag:e.tagName,classes:e.className,text:e.textContent.slice(0,100)}))}));
            console.log('MOBILE_LAYOUT',JSON.stringify(layout));assert.ok(layout.scroll<=layout.width+2,'No horizontal overflow on mobile');
            await page.fill('#propertyMapAddress','205 Government Street');assert.equal(await page.inputValue('#scCity'),'unknown');assert.equal(await page.locator('#permitOutput').isVisible(),false);assert.equal(await page.locator('#draftArea').isVisible(),false);
            await page.route('**/api/mobile-tree-gis?*',route=>route.fulfill({status:502,contentType:'application/json',body:JSON.stringify({status:'unavailable',error:'Controlled test: City service unavailable.'})}));
            await page.click('#findPropertyMap');await page.waitForFunction(()=>document.getElementById('propertyMapStatus').textContent.includes('Controlled test'));assert.equal(await page.inputValue('#scCity'),'unknown');
            assert.deepEqual(errors,[]);
            console.log('HOSTED_BROWSER_PASS',JSON.stringify({checkedAt:new Date().toISOString(),browser:'Chrome, mobile viewport; not physical iPhone',realAddressAndLayers:true,realImageryLoaded:true,mapConfirmationRequired:true,autofill:true,permitResult:true,workerQualifications:true,emailContainsMapSources:true,changedAddressInvalidates:true,controlledOutageStaysUnknown:true,pageErrors:errors}));
          } finally {await browser.close();}
          NODE
          node "$RUNNER_TEMP/tree-map-check/check.mjs"
