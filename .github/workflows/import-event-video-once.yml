name: Import and verify approved event video
on:
  push:
    branches: [feature/plant-event-video-2026-11-06]
    paths: [.github/workflows/import-event-video-once.yml]
permissions:
  contents: write
concurrency:
  group: plant-event-video-import
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  import-and-check:
    if: github.ref == 'refs/heads/feature/plant-event-video-2026-11-06'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Import exactly the approved website files
        env:
          SOURCE_URL: 'https://sdmntprcentralus.oaiusercontent.com/files/00000000-9298-81f5-9dda-1bc0838f927b/raw?se=2026-11-06T20%3A16%3A35Z&sp=r&sv=2026-02-06&sr=b&scid=14916c33-b983-5b4d-a4c8-676338d4e6e0&skoid=d1cabc79-3240-4866-94fe-6005330cb49e&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-06T18%3A27%3A12Z&ske=2026-11-07T18%3A27%3A12Z&sks=b&skv=2026-02-06&sig=H%2BR/D5W8IDzcT7h%2BH1l4HpYha%2B6Na7UUnp62q3uWLTE%3D'
        run: |
          echo "::add-mask::$SOURCE_URL"
          python3 - <<'PY'
          import os,io,json,hashlib,subprocess,urllib.request,zipfile
          from pathlib import Path
          assert subprocess.check_output(['git','hash-object','app/plant/PlantingGuide.tsx'],text=True).strip()=='0560f40a3ccf5fedfe2f5a4f0dd5fe74156cec79','Source changed; reconcile before import.'
          data=urllib.request.urlopen(os.environ['SOURCE_URL'],timeout=45).read()
          assert hashlib.sha256(data).hexdigest()=='bb02d6cd506bfce3bb7899eed795e34c977c83b515944386d91898cbdc0eca21'
          allowed={'app/plant/GiveawayAcknowledgment.tsx','app/plant/giveaway-acknowledgment.css','app/plant/PlantingGuide.tsx','scripts/verify-giveaway-video.mjs','public/plant/event/alabama-urban-forestry-association.png','public/plant/event/arbor-day-foundation.png','public/plant/event/verizon.png','public/plant/event/arbor-day-banner-poster.jpg','public/plant/event/arbor-day-banner-silent.mp4'}
          with zipfile.ZipFile(io.BytesIO(data)) as z:
            hashes=json.loads(z.read('manifest.json'))
            for name in sorted(allowed):
              b=z.read(name)
              assert hashlib.sha256(b).hexdigest()==hashes[name],name
              p=Path(name);p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(b)
          PY
          git diff --exit-code -- package.json package-lock.json components/SiteHeader.tsx components/TheArboristHomePage.tsx app/plant/tree-inventory.json app/plant/TreePicker.tsx app/plant/tree-picker.css
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/plant/GiveawayAcknowledgment.tsx app/plant/giveaway-acknowledgment.css app/plant/PlantingGuide.tsx scripts/verify-giveaway-video.mjs public/plant/event/
          git commit -m 'Add silent in-view looping giveaway video with pause controls, reduced-motion fallback and original partner logos'
          git push origin HEAD:refs/heads/feature/plant-event-video-2026-11-06
      - name: Record exact tested source and audio-free media
        if: always()
        run: |
          mkdir -p review-output
          git rev-parse HEAD > review-output/tested-commit.txt
          git archive --format=zip HEAD -o review-output/site-source.zip
          ffprobe -v error -show_entries format=duration,size -show_entries stream=codec_type,codec_name,width,height -of json public/plant/event/arbor-day-banner-silent.mp4 > review-output/video-streams.json
          python3 -c "import json; d=json.load(open('review-output/video-streams.json')); assert len(d['streams'])==1 and d['streams'][0]['codec_type']=='video'; assert 10<float(d['format']['duration'])<12"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Type check and production build
        run: |
          npm run typecheck 2>&1 | tee review-output/typecheck.log
          npm run build 2>&1 | tee review-output/build.log
          test -s .next/BUILD_ID
      - name: Verify original guide and new video behaviors
        run: |
          npm install --prefix "$RUNNER_TEMP/event-tools" --no-save --package-lock=false playwright axe-core
          ln -s "$RUNNER_TEMP/event-tools/node_modules/playwright" node_modules/playwright
          "$RUNNER_TEMP/event-tools/node_modules/.bin/playwright" install --with-deps chromium
          npm run start > review-output/server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            kill -0 "$server_pid" || { cat review-output/server.log; exit 1; }
            curl --fail --silent http://127.0.0.1:3000/plant >/dev/null && break
            sleep 2
          done
          node scripts/verify-plant.mjs
          AXE_SCRIPT="$RUNNER_TEMP/event-tools/node_modules/axe-core/axe.min.js" node scripts/verify-plant-polish.mjs
          AXE_SCRIPT="$RUNNER_TEMP/event-tools/node_modules/axe-core/axe.min.js" node scripts/verify-giveaway-video.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: plant-event-video-review
          path: review-output/
          retention-days: 7
