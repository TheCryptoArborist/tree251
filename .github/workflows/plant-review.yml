name: Plant guide review
on:
  push:
    branches: [main]
    paths: ['app/plant/**', 'public/plant/**', 'scripts/verify-plant*.mjs', 'components/SiteHeader.tsx', 'components/TheArboristHomePage.tsx', 'app/sitemap.ts', '.github/workflows/plant-review.yml']
  pull_request:
    branches: [main]
    paths: ['app/plant/**', 'public/plant/**', 'scripts/verify-plant*.mjs', 'components/SiteHeader.tsx', 'components/TheArboristHomePage.tsx', 'app/sitemap.ts', '.github/workflows/plant-review.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: plant-guide-review-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
defaults:
  run:
    shell: bash
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Record tested source
        run: |
          mkdir -p review-output
          git rev-parse HEAD > review-output/tested-commit.txt
          git archive --format=zip HEAD -o review-output/site-source.zip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Check dependency security without changing versions
        run: |
          npm audit --json > review-output/dependency-audit.json || true
          npm audit --omit=dev --json > review-output/production-audit.json
          npm audit --audit-level=high
      - name: Type check
        run: npm run typecheck 2>&1 | tee review-output/typecheck.log
      - name: Production build
        run: |
          npm run build 2>&1 | tee review-output/build.log
          test -s .next/BUILD_ID
      - name: Responsive browser, accessibility, and print checks
        run: |
          npm install --prefix "$RUNNER_TEMP/plant-browser" --no-save --package-lock=false playwright axe-core
          ln -s "$RUNNER_TEMP/plant-browser/node_modules/playwright" node_modules/playwright
          "$RUNNER_TEMP/plant-browser/node_modules/.bin/playwright" install chromium
          npm run start > review-output/server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            kill -0 "$server_pid" || { cat review-output/server.log; exit 1; }
            curl --fail --silent http://127.0.0.1:3000/plant >/dev/null && break
            sleep 2
          done
          curl --fail --silent http://127.0.0.1:3000/plant >/dev/null
          node scripts/verify-plant.mjs
          AXE_SCRIPT="$RUNNER_TEMP/plant-browser/node_modules/axe-core/axe.min.js" node scripts/verify-plant-polish.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: plant-final-review
          path: review-output/
          retention-days: 7
