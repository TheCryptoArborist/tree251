name: Plant guide review
on:
  push:
    branches: [review/plant-education-2026-11-05]
    paths:
      - app/plant/**
      - scripts/verify-plant.mjs
      - .github/workflows/plant-review.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: plant-guide-review
  cancel-in-progress: true
jobs:
  verify:
    if: github.ref == 'refs/heads/review/plant-education-2026-11-05'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Correct React numeric focus attributes
        run: |
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          p = Path('app/plant/PlantingGuide.tsx')
          s = p.read_text()
          before = '444990ce8975f78e81ff9ea6a4cc44bc36ee6a359c60a68b0e958757bc011eb7'
          after = '04aef6835c7bbabea56eeeb40b3aed69bb0af53fced1cc56885bef3fbfe8bd51'
          assert hashlib.sha256(s.encode()).hexdigest() in [before, after]
          s = s.replace('tabIndex="0"', 'tabIndex={0}').replace('tabIndex="-1"', 'tabIndex={-1}')
          assert hashlib.sha256(s.encode()).hexdigest() == after
          p.write_text(s)
          PY
          if ! git diff --quiet -- app/plant/PlantingGuide.tsx; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add app/plant/PlantingGuide.tsx
            git commit -m 'Use numeric React tabIndex values in accessible planting guide controls'
            git push origin HEAD:refs/heads/review/plant-education-2026-11-05
          fi
      - name: Collect integrated source
        if: always()
        run: |
          mkdir -p review-output
          cp public/arborist-logo-cropped.png review-output/arborist-logo-cropped.png
          git archive --format=zip HEAD -o review-output/site-source.zip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Type check
        run: npm run typecheck 2>&1 | tee review-output/typecheck.log
      - name: Production build
        run: npm run build 2>&1 | tee review-output/build.log
      - name: Browser checks
        run: |
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps chromium
          npm run start > review-output/server.log 2>&1 &
          for i in $(seq 1 45); do curl --fail --silent http://127.0.0.1:3000/plant >/dev/null && break; sleep 2; done
          node scripts/verify-plant.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: plant-review-checks
          path: review-output/
          retention-days: 7
