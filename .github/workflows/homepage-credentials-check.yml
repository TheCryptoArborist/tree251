name: Homepage credential regression checks
on:
  pull_request:
    branches: [main]
    paths:
      - 'app/page.tsx'
      - 'components/TheArboristHomePage.tsx'
      - 'components/CredentialBadges.tsx'
      - 'public/assets/credential-*'
      - 'scripts/verify-homepage-credentials.mjs'
      - '.github/workflows/homepage-credentials-check.yml'
  push:
    branches: [main]
    paths:
      - 'app/page.tsx'
      - 'components/TheArboristHomePage.tsx'
      - 'components/CredentialBadges.tsx'
      - 'public/assets/credential-*'
      - 'scripts/verify-homepage-credentials.mjs'
      - '.github/workflows/homepage-credentials-check.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: homepage-credentials-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
defaults:
  run:
    shell: bash
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Record tested source
        run: |
          mkdir -p review-output
          git rev-parse HEAD > review-output/tested-commit.txt
          sha256sum package.json package-lock.json > review-output/dependency-checksums.txt
      - run: npm ci
      - name: Production build and type check
        run: |
          npm run build 2>&1 | tee review-output/build.log
          npm run typecheck 2>&1 | tee review-output/typecheck.log
          test -s .next/BUILD_ID
      - name: Browser checks at phone, tablet, and desktop widths
        run: |
          npm install --prefix "$RUNNER_TEMP/credential-tools" --no-save --package-lock=false playwright axe-core
          ln -s "$RUNNER_TEMP/credential-tools/node_modules/playwright" node_modules/playwright
          "$RUNNER_TEMP/credential-tools/node_modules/.bin/playwright" install --with-deps chromium
          npm run start > review-output/server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            kill -0 "$server_pid" || { cat review-output/server.log; exit 1; }
            curl --fail --silent http://127.0.0.1:3000/ >/dev/null && break
            sleep 2
          done
          curl --fail --silent http://127.0.0.1:3000/ >/dev/null
          AXE_SCRIPT="$RUNNER_TEMP/credential-tools/node_modules/axe-core/axe.min.js" node scripts/verify-homepage-credentials.mjs
          sha256sum --check review-output/dependency-checksums.txt
      - name: Read-only production verification after publication
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          node --input-type=module <<'JS'
          let ready = false;
          for (let attempt = 0; attempt < 60; attempt++) {
            try {
              const response = await fetch('https://www.tree251.xyz/', { signal: AbortSignal.timeout(10000), headers: { 'Cache-Control': 'no-cache' } });
              const html = await response.text();
              if (response.ok && html.includes('id="credentials-heading"') && html.includes('credential-ppq.png?v=6')) { ready = true; break; }
            } catch {}
            await new Promise(resolve => setTimeout(resolve, 2000));
          }
          if (!ready) throw new Error('Published credentials were not available during this verification run.');
          JS
          CREDENTIALS_TEST_ORIGIN=https://www.tree251.xyz CREDENTIALS_OUTPUT=review-output/live-credentials AXE_SCRIPT="$RUNNER_TEMP/credential-tools/node_modules/axe-core/axe.min.js" node scripts/verify-homepage-credentials.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: homepage-credentials-review
          path: review-output/
          retention-days: 7
