name: Apply confirmed tree inventory once
on:
  push:
    branches: [update/plant-confirmed-inventory-2026-11-06]
    paths: [.github/workflows/apply-confirmed-inventory.yml]
permissions:
  contents: write
concurrency:
  group: apply-confirmed-tree-inventory
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  apply:
    if: github.ref == 'refs/heads/update/plant-confirmed-inventory-2026-11-06'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Apply guarded application edits only
        run: |
          python scripts/apply-inventory-update.py
          node --check scripts/verify-plant.mjs
          node --check scripts/verify-plant-polish.mjs
          git restore .github/workflows/dependency-security-review.yml .github/workflows/plant-live-check.yml
          git diff --exit-code -- package.json package-lock.json components/SiteHeader.tsx app/plant/opengraph-image.tsx public/arborist-logo-cropped.png .github/workflows
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/plant/InventorySections.tsx app/plant/PlantingGuide.tsx app/plant/TreePicker.tsx app/plant/page.tsx app/plant/PlantingVisuals.tsx app/plant/plant-photos.json public/plant/PHOTO-LICENSES.json scripts/verify-plant.mjs scripts/verify-plant-polish.mjs
          git commit -m 'Integrate all ten confirmed trees, common-name aftercare, species-specific planting exceptions and matching tests'
          git push origin HEAD:refs/heads/update/plant-confirmed-inventory-2026-11-06
