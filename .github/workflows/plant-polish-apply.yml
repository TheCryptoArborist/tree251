name: Apply isolated plant polish
on:
  push:
    branches: [review/plant-polish-2026-11-06]
    paths: [.github/workflows/plant-polish-apply.yml]
permissions:
  contents: write
  actions: read
concurrency:
  group: isolated-plant-polish
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  apply-and-verify:
    if: github.ref == 'refs/heads/review/plant-polish-2026-11-06'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: plant-polish-media
          path: media-import
          run-id: 42223276294
          github-token: ${{ github.token }}
      - run: python -m pip install --target "$RUNNER_TEMP/photo-libs" Pillow
      - name: Apply the reconciled polish and preserve the first-screen selector
        env:
          PYTHONPATH: ${{ runner.temp }}/photo-libs
        run: |
          python scripts/reconcile-plant-polish.py
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/apply-plant-polish.py');s=p.read_text()
          s=s.replace('c853c8b55f90d61a8025774d53bc54304be90e36c98a9ccbe594bddd0f2a1a69','e53ad4d0167c28525ad56d0a7461b2c001695fd628e2f47b9408ab48e423f9fa')
          s=s.replace('c8aeabcddfb23cc3b3b40bb4463345ad0cd78114e7e4e5d0d8197a43a2a894d1','b719fccc49f9dc220e3b966a134e90b3c2a63f0b72ae6df714e62e6c3e52e228')
          p.write_text(s)
          exec(compile(s,str(p),'exec'))
          p=Path('app/plant/PlantingGuide.tsx');s=p.read_text().replace('<TreeFinder />','').replace('TreeFinder, SpeciesPhotos','SpeciesPhotos').replace('import "./tree-shortcuts.css";\n','');p.write_text(s)
          p=Path('app/plant/page.tsx');s=p.read_text().replace('import PlantingGuide from "./PlantingGuide";','import PlantingGuide from "./PlantingGuide";\nimport TreePicker from "./TreePicker";\nimport "./tree-picker.css";');s=s.replace('return <><script','return <div className="plant-page"><script').replace('/><PlantingGuide /></>;','/><TreePicker /><PlantingGuide /></div>;');p.write_text(s)
          p=Path('app/plant/plant-polish.css');p.write_text(p.read_text()+'''\n/* Keep the prominent first-screen selector and a compact introduction. */
          .plant-guide .hero{display:block;padding-top:28px;padding-bottom:28px}
          .plant-guide .hero-copy{max-width:760px}
          .plant-guide .hero h1{font-size:45px;margin-bottom:14px}
          .plant-guide .hero .intro{max-width:680px;margin-bottom:18px}
          .plant-page .tree-picker-kicker{font-size:12px}
          @media(max-width:640px){.plant-guide .hero h1{font-size:36px}.plant-guide .hero{padding-top:24px;padding-bottom:22px}}
          @media print{.plant-page>.tree-picker{display:none!important}}
          ''')
          p=Path('scripts/verify-plant-polish.mjs');s=p.read_text().replace("'.tree-picker a'","'#choose-tree .tree-picker-buttons a'").replace("'#tree-selector'","'#choose-tree'").replace("'.tree-picker a, .care-tab, .hero-actions .button'","'#choose-tree .tree-picker-buttons a, .care-tab, .hero-actions .button'").replace('`.tree-picker a[href=', '`#choose-tree .tree-picker-buttons a[href=');p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/plant public/plant components/SiteHeader.tsx components/TheArboristHomePage.tsx app/sitemap.ts scripts/verify-plant-polish.mjs
          git rm -f .github/workflows/plant-polish-apply.yml .github/workflows/plant-polish-media.yml scripts/apply-plant-polish.py scripts/reconcile-plant-polish.py
          git commit -m 'Finish planting guide photos, planting diagram, mobile readability, print layout, navigation and sharing card'
          git push origin HEAD:refs/heads/review/plant-polish-2026-11-06
      - name: Record exact tested source
        if: always()
        run: |
          mkdir -p review-output
          git rev-parse HEAD > review-output/tested-commit.txt
          git archive --format=zip HEAD -o review-output/site-source.zip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Record dependency audit without changing versions
        run: npm audit --json > review-output/dependency-audit.json || true
      - name: Type check
        run: npm run typecheck 2>&1 | tee review-output/typecheck.log
      - name: Production build
        run: |
          npm run build 2>&1 | tee review-output/build.log
          test -s .next/BUILD_ID
      - name: Browser, accessibility and print verification
        run: |
          npm install --prefix "$RUNNER_TEMP/plant-tools" --no-save --package-lock=false playwright axe-core
          ln -s "$RUNNER_TEMP/plant-tools/node_modules/playwright" node_modules/playwright
          "$RUNNER_TEMP/plant-tools/node_modules/.bin/playwright" install --with-deps chromium
          npm run start > review-output/server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            kill -0 "$server_pid" || { cat review-output/server.log; exit 1; }
            curl --fail --silent http://127.0.0.1:3000/plant >/dev/null && break
            sleep 2
          done
          curl --fail --silent http://127.0.0.1:3000/plant >/dev/null
          node scripts/verify-plant.mjs
          AXE_SCRIPT="$RUNNER_TEMP/plant-tools/node_modules/axe-core/axe.min.js" node scripts/verify-plant-polish.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: plant-polish-review
          path: review-output/
          retention-days: 7
