name: Mobile tree quick digging check
on:
  pull_request:
    paths:
      - 'public/testing/mobile-tree-quick-digging.mjs'
      - 'public/testing/mobile-tree-worker-qualifications.mjs'
      - 'scripts/test-mobile-tree-quick-digging*.mjs'
      - '.github/workflows/mobile-tree-quick-digging.yml'
permissions:
  contents: read
jobs:
  quick-digging:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - name: Keep the exact tested source for inspection
        run: |
          mkdir -p test-artifacts/source/public test-artifacts/source/scripts
          cp -r public/testing test-artifacts/source/public/
          cp scripts/test-mobile-tree-*.mjs test-artifacts/source/scripts/
      - name: Install isolated browser test dependency
        run: npm install --prefix "$RUNNER_TEMP/quick-digging-test" --no-audit --no-fund playwright
      - name: Syntax and unchanged decision rules
        run: |
          node --check public/testing/mobile-tree-quick-digging.mjs
          node --check scripts/test-mobile-tree-quick-digging-browser.mjs
          node --test scripts/test-mobile-tree-quick-digging.mjs scripts/test-mobile-tree-digging.mjs scripts/test-mobile-tree-resident-decisions.mjs
      - name: Short form, immediate warning, saved record and email
        if: always()
        env:
          PREVIEW_ORIGIN: https://deploy-preview-9--tree251.netlify.app
          BROWSER_DEPS: ${{ runner.temp }}/quick-digging-test
        run: node scripts/test-mobile-tree-quick-digging-browser.mjs
      - name: Save source and mobile review images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quick-digging-preview-check
          path: test-artifacts/
          if-no-files-found: ignore
