name: Mobile tree task tabs
on:
  pull_request:
    paths:
      - 'public/testing/mobile-tree-*.mjs'
      - 'public/testing/mobile-tree-checker.html'
      - 'scripts/test-mobile-tree-task-tabs.mjs'
      - '.github/workflows/mobile-tree-task-tabs.yml'
permissions:
  contents: read
jobs:
  task-tabs:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - name: Check syntax and unchanged tree and root decision rules
        run: |
          node --check public/testing/mobile-tree-task-tabs.mjs
          node --check scripts/test-mobile-tree-task-tabs.mjs
          node --test scripts/test-mobile-tree-digging.mjs scripts/test-mobile-tree-resident-decisions.mjs
      - name: Install isolated browser test dependency
        run: npm install --prefix "$RUNNER_TEMP/task-tabs-test" --no-audit --no-fund playwright
      - name: Verify exact hosted tab build, retained facts, direct links and fresh results
        env:
          PREVIEW_ORIGIN: https://deploy-preview-9--tree251.netlify.app
          BROWSER_DEPS: ${{ runner.temp }}/task-tabs-test
        run: node scripts/test-mobile-tree-task-tabs.mjs
      - name: Save mobile layout screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: task-tabs-preview-check
          path: test-artifacts/
          if-no-files-found: ignore
