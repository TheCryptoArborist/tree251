name: Plant polish media review
on:
  push:
    branches: [review/plant-education-2026-11-05]
    paths: [.github/workflows/plant-polish-media.yml]
permissions:
  contents: read
jobs:
  collect:
    if: github.ref == 'refs/heads/review/plant-education-2026-11-05'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python -m pip install --target "$RUNNER_TEMP/photo-libs" Pillow
      - name: Fetch licensed source images and prepare local web images
        env:
          PYTHONPATH: ${{ runner.temp }}/photo-libs
        run: |
          python - <<'PY'
          import io, json, re, html, hashlib, urllib.request, urllib.parse
          from pathlib import Path
          from PIL import Image, ImageOps
          out = Path('media-review'); out.mkdir()
          source = 'https://plants.ces.ncsu.edu/plants/'
          s3 = 'https://eit-planttoolbox-prod.s3.amazonaws.com/media/images/'
          records = [
            ['live-oak','form','Southern live oak — mature form','Lucy Bradley','CC0','https://creativecommons.org/publicdomain/zero/1.0/',source+'quercus-virginiana/',s3+'Quercus_virginiana--_OfQKJ461OYhz.jpe','Mature southern live oak with a broad spreading crown.'],
            ['live-oak','detail','Southern live oak — leaves and male flowers','Miwasatoshi','CC BY-SA 4.0','https://creativecommons.org/licenses/by-sa/4.0/',source+'quercus-virginiana/',s3+'Quercus-virginiana-m_GpWK8MAt4Xp5.jfif','Southern live oak foliage with hanging male flower clusters.'],
            ['overcup-oak','form','Overcup oak — form and acorn','US Government employee','Public domain','https://creativecommons.org/publicdomain/mark/1.0/',source+'quercus-lyrata/',s3+'Quercus_lyrata_form__e6ApS9zPsLsK.jpe','Overcup oak tree form and an acorn with its enclosing cup.'],
            ['overcup-oak','detail','Overcup oak — leaves and acorns','Katherline Wagner-Reiss','CC BY-SA 4.0','https://creativecommons.org/licenses/by-sa/4.0/',source+'quercus-lyrata/',s3+'Quercus_lyrata_leave_bnA4EnbbHWAp.jpeg','Lobed overcup oak leaves and acorns at Morris Arboretum.'],
            ['black-gum','form','Black gum — mature tree','Bostonian13','CC BY-SA 3.0','https://creativecommons.org/licenses/by-sa/3.0/','https://commons.wikimedia.org/wiki/File:Nyssa_sylvatica_tree.jpg','https://upload.wikimedia.org/wikipedia/commons/6/6d/Nyssa_sylvatica_tree.jpg','Mature black gum with an upright leafy crown at Arnold Arboretum.'],
            ['black-gum','detail','Black gum — foliage and immature fruit','Richard Webb, Bugwood.org','CC BY 3.0 US','https://creativecommons.org/licenses/by/3.0/us/','https://commons.wikimedia.org/wiki/File:Nyssa_sylvatica_foliage.jpg','https://upload.wikimedia.org/wikipedia/commons/c/ce/Nyssa_sylvatica_foliage.jpg','Simple black gum leaves and small immature fruits.'],
            ['chaste-tree','form','Chaste tree — flowering habit (Latifolia)','Lenora (Ellie) Enking','CC BY-SA 4.0','https://creativecommons.org/licenses/by-sa/4.0/',source+'vitex-agnus-castus/',s3+'Vitex-agnus-castus-Latifolia--Lenora-Ellie-Enking--CC-BY-SA.jpg','Flowering chaste tree; the pictured selection is Latifolia, not a confirmed giveaway cultivar.'],
            ['chaste-tree','detail','Chaste tree — flowers (Abbeville Blue)','K M','CC BY 4.0','https://creativecommons.org/licenses/by/4.0/',source+'vitex-agnus-castus/',s3+'Vitex-agnus-castus-Abbeville_Blue-KM--CC-BY.jpg','Blue flower spikes on the Abbeville Blue selection of chaste tree.'],
            ['bald-cypress','form','Bald cypress — mature form','Bogdan','CC BY-SA 3.0','https://creativecommons.org/licenses/by-sa/3.0/',source+'taxodium-distichum/',s3+'Taxodium_distichum___X8vKawOwRZki.jpeg','Mature bald cypress with a broad crown beside water.'],
            ['bald-cypress','detail','Bald cypress — needle-like leaves','Forest and Kim Starr','CC BY 2.0','https://creativecommons.org/licenses/by/2.0/',source+'taxodium-distichum/',s3+'Taxodium-distichum--Forest-and-Kim-Starr--cc-by-2-0.jpg','Bald cypress branchlets with flat needle-like leaves arranged in two rows.']
          ]
          headers={'User-Agent':'TheArboristPlantGuide/1.0 (+https://tree251.xyz)'}
          def fetch(url):
            with urllib.request.urlopen(urllib.request.Request(url,headers=headers),timeout=40) as r:
              data=r.read(25000000)
              assert len(data)<25000000, 'Image exceeds size limit'
              return data
          pages={}; results=[]; failures=[]
          for slug,view,title,author,license,licenseUrl,sourceUrl,upstream,alt in records:
            try:
              try: data=fetch(upstream)
              except Exception:
                if 'plants.ces.ncsu.edu' not in sourceUrl: raise
                if sourceUrl not in pages: pages[sourceUrl]=fetch(sourceUrl).decode()
                filename=urllib.parse.urlsplit(upstream).path.split('/')[-1]
                links=re.findall(r'(?:src|href)=[\"\x27]([^\"\x27]+)',pages[sourceUrl])
                candidates=[html.unescape(u) for u in links if filename in u and 's3.amazonaws.com' in u]
                assert candidates, 'Source did not expose expected image'
                data=fetch(candidates[0])
              image=ImageOps.exif_transpose(Image.open(io.BytesIO(data))).convert('RGB')
              image.thumbnail((960,960), Image.Resampling.LANCZOS)
              path=out/f'{slug}-{view}.webp'
              image.save(path,'WEBP',quality=84,method=6)
              results.append(dict(species=slug,view=view,title=title,author=author,license=license,licenseUrl=licenseUrl,sourceUrl=sourceUrl,upstream=upstream,alt=alt,src=f'/plant/{path.name}',width=image.width,height=image.height,changes='Resized and converted to WebP; composition preserved.',sourceSha256=hashlib.sha256(data).hexdigest(),sha256=hashlib.sha256(path.read_bytes()).hexdigest(),bytes=path.stat().st_size))
              print('Prepared',path.name,image.size,path.stat().st_size)
            except Exception as e:
              failures.append(dict(species=slug,view=view,error=str(e)))
              print('FAILED',slug,view,str(e))
          (out/'plant-photos.json').write_text(json.dumps(results,indent=2))
          (out/'failures.json').write_text(json.dumps(failures,indent=2))
          assert not failures, str(failures)
          PY
      - name: Include current draft source for verification
        if: always()
        run: git archive --format=zip HEAD -o media-review/site-source.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: plant-polish-media
          path: media-review/
          retention-days: 7
